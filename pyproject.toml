[project]
name = "stockroom"
version = "0.1.0"
description = "Echorec sample repository for shape C (regulated enterprise)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
